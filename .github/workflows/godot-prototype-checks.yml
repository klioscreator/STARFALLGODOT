name: Godot Prototype Checks

on:
  push:
    branches:
      - phase-03-prototype-ait0405
  pull_request:
    branches:
      - main

jobs:
  headless-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify engine
        run: godot --version

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Run domain tests
        run: godot --headless --path . -s res://tests/run_tests.gd
